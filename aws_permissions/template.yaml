AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudGuardAI - Serverless Infrastructure Risk Analysis & Security Platform
  Provisions Amazon S3 (private storage), Amazon DynamoDB (scans table),
  AWS Lambda (FastAPI/Mangum REST API & Async Worker), and Amazon API Gateway HTTP API v2.
  Optimized for AWS Academy Learner Lab (LabRole compatible) and commercial AWS accounts.
  NOTE: DO NOT DEPLOY WITHOUT EXPLICIT APPROVAL (ZERO-UNAPPROVED-DEPLOYMENT POLICY).

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Deployment target environment.

  ExecutionRoleArn:
    Type: String
    Default: ""
    Description: Optional explicit IAM Role ARN. If blank in AWS Academy, defaults to arn:aws:iam::<AccountId>:role/LabRole.

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Amazon Bedrock Foundation Model ID for remediation guidance synthesis.

Conditions:
  UseCustomRole: !Not [!Equals [!Ref ExecutionRoleArn, ""]]

Resources:
  # =========================================================================
  # 1. STORAGE: Private Amazon S3 Bucket (Templates & Reports)
  # =========================================================================
  CloudGuardArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cloudguardai-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryUploadsAfter30Days
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30

  # =========================================================================
  # 2. PERSISTENCE: Amazon DynamoDB Table (Pay-Per-Request, Zero Idle Cost)
  # =========================================================================
  CloudGuardScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloudguardai_scans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: scan_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CreatedAtIndex
          KeySchema:
            - AttributeName: scan_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # =========================================================================
  # 3. HTTP API GATEWAY: Amazon API Gateway HTTP API v2 (Low-Latency, CORS)
  # =========================================================================
  CloudGuardHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 600

  # =========================================================================
  # 4. COMPUTE: AWS Lambda FastAPI Gateway Handler (Mangum)
  # =========================================================================
  CloudGuardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "cloudguardai-api-${Environment}"
      CodeUri: ../
      Handler: backend.app.main.handler
      Runtime: python3.11
      MemorySize: 512
      Timeout: 29
      Role: !If
        - UseCustomRole
        - !Ref ExecutionRoleArn
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          STORAGE_BACKEND: s3
          DATABASE_BACKEND: dynamodb
          REMEDIATION_BACKEND: hybrid
          S3_BUCKET_NAME: !Ref CloudGuardArtifactsBucket
          DYNAMODB_TABLE_NAME: !Ref CloudGuardScansTable
          AWS_BEDROCK_MODEL_ID: !Ref BedrockModelId
          AWS_REGION_DEFAULT: !Ref AWS::Region
      Events:
        HttpApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudGuardHttpApi
            Path: /{proxy+}
            Method: ANY
        HttpApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudGuardHttpApi
            Path: /
            Method: ANY

  # =========================================================================
  # 5. COMPUTE: AWS Lambda Asynchronous Analysis Worker
  # =========================================================================
  CloudGuardAsyncWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "cloudguardai-worker-${Environment}"
      CodeUri: ../
      Handler: backend.app.lambda_handler.lambda_handler
      Runtime: python3.11
      MemorySize: 512
      Timeout: 60
      Role: !If
        - UseCustomRole
        - !Ref ExecutionRoleArn
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          STORAGE_BACKEND: s3
          DATABASE_BACKEND: dynamodb
          S3_BUCKET_NAME: !Ref CloudGuardArtifactsBucket
          DYNAMODB_TABLE_NAME: !Ref CloudGuardScansTable
          AWS_BEDROCK_MODEL_ID: !Ref BedrockModelId
      Events:
        S3BlueprintUploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref CloudGuardArtifactsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

Outputs:
  ApiGatewayEndpoint:
    Description: HTTP API v2 Public Endpoint URL
    Value: !Sub "https://${CloudGuardHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  S3ArtifactsBucketName:
    Description: Private Amazon S3 Storage Bucket
    Value: !Ref CloudGuardArtifactsBucket

  DynamoDBTableName:
    Description: Amazon DynamoDB Persistence Table
    Value: !Ref CloudGuardScansTable
