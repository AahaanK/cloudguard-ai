# Render Blueprint Specification for CloudGuardAI
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cloudguardai
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_BACKEND
        value: local
      - key: DATABASE_BACKEND
        value: sqlite
      - key: REMEDIATION_BACKEND
        value: hybrid
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: anthropic.claude-3-haiku-20240307-v1:0
      - key: PYTHON_VERSION
        value: 3.11.9
